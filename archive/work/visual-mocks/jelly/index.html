<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jelly Office Mock</title>
<style>
  :root { --ink:#25221f; --muted:#776f66; --panel:rgba(255,252,247,.86); --line:rgba(37,34,31,.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#f3ece2; color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Inter",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; } #stage canvas { display:block; }
  .bar { position:fixed; top:16px; left:16px; right:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; pointer-events:none; }
  .bar > * { pointer-events:auto; }
  .brand, .seg, .panel { background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; }
  .brand { padding:9px 14px; } .brand b { display:block; font-size:15px; } .brand small { color:var(--muted); }
  .seg { display:flex; padding:4px; gap:2px; align-items:center; }
  .seg .lbl { padding:0 6px 0 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .seg button, .panel button { border:0; background:transparent; padding:7px 11px; border-radius:9px; font:inherit; color:var(--muted); cursor:pointer; }
  .seg button[aria-pressed="true"], .panel button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:600; }
  #fps { margin-left:auto; font:12px ui-monospace,Menlo,monospace; color:var(--muted); background:var(--panel); padding:6px 10px; border-radius:10px; border:1px solid var(--line); }
  .panel { position:fixed; right:16px; bottom:16px; width:300px; padding:12px; }
  .panel h3 { margin:0 0 4px; font-size:13px; } .panel p { margin:0 0 10px; color:var(--muted); font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .panel .act { background:#25221f; color:#fff; font-weight:600; }
  #chips { position:fixed; left:16px; bottom:16px; display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100% - 350px); }
  .chip { display:flex; gap:7px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 8px; font:inherit; color:var(--ink); cursor:pointer; backdrop-filter:blur(14px); }
  .chip[aria-pressed="true"] { outline:2px solid #25221f; }
  .chip .dot { width:12px; height:12px; border-radius:50%; } .chip small { color:var(--muted); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#f3ece2; color:var(--muted); z-index:5; }
  @media (max-width:700px) { .panel { left:16px; right:16px; width:auto; } #chips { display:none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading">Warming up the jelly…</div>
<div class="bar">
  <div class="brand"><b>Jelly office</b><small>Snail-bean agents · visual mock</small></div>
  <div class="seg"><span class="lbl">Colours</span><button data-palette="provider" aria-pressed="true">Teal / terracotta</button><button data-palette="vivid" aria-pressed="false">Blue / red</button></div>
  <div class="seg"><span class="lbl">Team</span><button data-count="2" aria-pressed="false">2</button><button data-count="6" aria-pressed="true">6</button><button data-count="12" aria-pressed="false">12</button><button data-count="20" aria-pressed="false">20</button></div>
  <div class="seg"><button id="overview">Overview</button><button id="close">Close-up</button></div>
  <span id="fps">–</span>
</div>
<div id="chips"></div>
<div class="panel">
  <h3>Selected bean</h3>
  <p>Click a bean to poke it. Drag to orbit, scroll to zoom.</p>
  <div class="row"><button data-status="free">Free</button><button data-status="working">Working</button><button data-status="needs">Needs you</button><button data-status="review">Review</button></div>
  <div class="row"><button id="poke" class="act">Poke</button><button id="acc">Next accessory</button></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
