<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass AI Button Test</title>
<style>
  :root { --bg: #e6ecf0; --ink: #1b2730; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141a1f; --ink: #e6ecf0; } }
  :root[data-theme="dark"] { --bg: #141a1f; --ink: #e6ecf0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px Inter, system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  /* threeui.css: shared .threeui-background rule (SHA-256 efe44471…) */
  .threeui-background { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; isolation: isolate; background: #030304; }
  .shader-frame { width: min(1100px, 100%); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; }
</style>
</head>
<body>
  <div class="shader-frame" id="frame"></div>
  <script type="module">
    import { mountGlassAiButton } from "./vendor/threeui/glass-ai-button.js";
    mountGlassAiButton(document.getElementById("frame"));
  </script>
</body>
</html>
